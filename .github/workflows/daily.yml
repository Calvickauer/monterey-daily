name: Daily fetch & deploy
on:
  schedule: [{ cron: '0 13 * * *' }]   # ~6am PDT / 5am PST
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - if: github.event_name != 'push'
        run: npm run fetch   # fetch + dedupe (URL / headline / Spanish twins) + photo > AI image > illustration
      - if: github.event_name != 'push'
        run: |
          git config user.name "monterey-daily-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A src/content/stories public && (git diff --cached --quiet || (git commit -m "Daily stories $(date -u +%F)" && git push))
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
